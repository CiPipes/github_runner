services:
  github-runner:
    build:
      context: .
      args:
        - USERNAME=github_runner
        - USER_UID=1001
        - USER_GID=1001
        - RUNNER_VERSION=2.328.0
    container_name: github-runner-container
    restart: always
    env_file:
      - .env
    environment:
      - RUNNER_NAME=MY_RUNNER
      - RUNNER_LABELS=mylabel
